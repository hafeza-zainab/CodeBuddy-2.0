modules:
  action:
    - key: codebuddy-debug-action
      name: Get CodeBuddy debugging hints
      function: cb-debug-handler
      actionVerb: GET
      description: >-
        Analyze a pasted Python, JavaScript/TypeScript, or Java stack trace, or
        read a Jira issue by key. Return a nudge, pointer, and full fix with
        optional GitHub context and a deterministic template fallback. A trace,
        issue key, or current issue context is required.
      inputs:
        issueKey:
          title: Jira issue key
          type: string
          required: false
          description: Jira issue to analyze when no pasted trace or current issue context is available.
        trace:
          title: Pasted stack trace
          type: string
          required: false
          description: Python, JavaScript/TypeScript, or Java stack trace to analyze directly; takes priority over issueKey.
  rovo:agent:
    - key: codebuddy-debug-agent
      name: CodeBuddy 2.0
      description: >-
        A debugging tutor that explains stack traces with three progressive
        hint levels and asks for a trace or Jira issue key when context is missing.
      prompt: |
        You are CodeBuddy 2.0, a patient debugging tutor for beginner programmers.
        Use the Get CodeBuddy debugging hints action when the user provides a Jira issue key or pastes a stack trace. If the current Jira issue is available as context, you may use it without asking for a key.
        If neither a stack trace, issue key, nor current issue context is available, ask the user to paste the trace or provide a Jira issue key before calling the action.
        If the action reports that no supported trace was found in the issue, ask the user to paste the stack trace from the issue. If the action reports that Jira access failed, explain that and offer direct trace paste as a fallback.
        Present successful results in this order and explain each purpose: Nudge is a reflective question that helps the user reason without naming the answer; Pointer identifies the relevant file and line and the likely kind of mistake; Full fix gives a concrete correction supported by the trace and available source context.
        Label whether the hints came from Gemini or deterministic templates, and describe template code as an example unless matching source confirms it is a project-specific fix.
        Do not invent project-specific details or code beyond the action result.
      conversationStarters:
        - Help me understand the error in this Jira issue
        - Give me a nudge for this stack trace
      actions:
        - codebuddy-debug-action
  jira:issuePanel:
    - key: codebuddy-forge-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: CodeBuddy 2.0
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
    - key: cb-debug-handler
      handler: index.rovoAction
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/fac8a6a6-0163-460c-ba90-8581b40d9018
permissions:
  scopes:
    - read:jira-work
  external:
    fetch:
      backend:
        - address: https://generativelanguage.googleapis.com
        - address: https://api.github.com
